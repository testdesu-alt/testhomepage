<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テスト用ホームページ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 8px;
        }
        h2 {
            color: #0066cc;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0066cc;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #004499;
        }
    </style>
</head>
<body>
    <header>
        <h1>私のテストサイト</h1>
    </header>
    <main>
        <h2>こんにちは！</h2>
        <p>これはHTMLとCSSで作ったテスト用のホームページです。</p>
        <a href="#" class="btn">ボタンのテスト</a>
    </main>
</body>
</html>
