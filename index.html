<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone X - Apple（日本）</title>
    <style>
        body {
            font-family: "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
            overflow-x: hidden;
        }

        /* 2017年当時のAppleナビゲーションバー */
        nav {
            width: 100%;
            height: 44px;
            background: rgba(51, 51, 51, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            font-size: 12px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        nav a { color: #cccccc; text-decoration: none; transition: color 0.2s; }
        nav a:hover { color: #fff; }

        /* メインの紹介エリア */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 44px;
            box-sizing: border-box;
            background: #ffffff;
        }

        .product-logo { font-size: 28px; font-weight: 600; margin: 0; color: #1d1d1f; }
        .product-title { font-size: 80px; font-weight: 700; letter-spacing: -2px; margin: 5px 0 10px 0; color: #000000; }
        .tagline { font-size: 24px; font-weight: 400; color: #1d1d1f; margin-bottom: 30px; }

        /* iPhone Xシルエット */
        .iphonex-mock {
            width: 220px;
            height: 440px;
            border-radius: 42px;
            background: linear-gradient(135deg, #d24dff, #ff4da6, #4d94ff);
            border: 11px solid #1c1c1e;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .notch {
            width: 120px;
            height: 25px;
            background-color: #1c1c1e;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        .screen-shine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(60deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 60%);
            animation: shine 4s infinite linear;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* アクションエリア */
        .cta-area {
            margin-top: 30px;
            display: flex;
            gap: 25px;
            font-size: 16px;
        }

        .link-action {
            color: #0066cc;
            text-decoration: none;
            display: inline-block;
        }
        .link-action:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- すべて本物のApple公式サイトに繋がるナビゲーションバー -->
    <nav>
        <a href="https://apple.com"></a>
        <a href="https://apple.comstore">Store</a>
        <a href="https://apple.commac/">Mac</a>
        <a href="https://apple.comipad/">iPad</a>
        <a href="https://apple.comiphone/">iPhone</a>
        <a href="https://apple.comwatch/">Watch</a>
        <a href="https://apple.com">Support</a>
    </nav>

    <!-- メインコンテンツ -->
    <div class="hero-section">
        <p class="product-logo">iPhone</p>
        <h1 class="product-title">X</h1>
        <div class="tagline">未来が、ここに。</div>
        
        <div class="iphonex-mock">
            <div class="notch"></div>
            <div class="screen-shine"></div>
        </div>

        <div class="cta-area">
            <!-- 当時のApple公式iPhone Xの公式YouTube紹介動画アーカイブへのリンク -->
            <a href="https://youtube.com" target="_blank" class="link-action">紹介ビデオを見る ＞</a>
            <!-- 現在のiPhone購入ページへジャンプするリンク -->
            <a href="https://apple.comshop/buy-iphone" target="_blank" class="link-action">購入 ＞</a>
        </div>
    </div>

</body>
</html>
