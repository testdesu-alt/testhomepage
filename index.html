<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 18 Pro - Apple（日本）</title>
    <style>
        /* Apple標準のフォントシステム */
        body {
            font-family: "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #f5f5f7;
            overflow-x: hidden;
        }

        /* 偽のAppleナビゲーションバー */
        nav {
            width: 100%;
            height: 44px;
            background: rgba(22, 22, 23, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        nav span { cursor: pointer; }
        nav span:hover { color: #fff; }

        /* メインの紹介エリア */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 44px;
            box-sizing: border-box;
            position: relative;
        }

        .tagline {
            font-size: 24px;
            font-weight: 600;
            color: #b4b4b8;
            margin-bottom: 5px;
        }

        .product-title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 20px 0;
            background: linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 超美麗なLiquid Glassで表現した新型iPhoneの概念オブジェクト */
        .iphone-mock {
            width: 200px;
            height: 400px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(0, 242, 254, 0.2); /* 謎の未来感ある発光 */
            position: relative;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 6s infinite ease-in-out;
        }

        /* 画面内で怪しく光る次世代チップのコア */
        .iphone-mock::before {
            content: "ANE X";
            font-size: 12px;
            font-weight: bold;
            color: #00f2fe;
            letter-spacing: 2px;
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        /* 購入ボタンエリア */
        .cta-area {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn-buy {
            background-color: #0071e3;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
        }
        .btn-buy:hover { background-color: #0077ed; }

        .link-more {
            color: #2997ff;
            text-decoration: none;
            font-size: 16px;
        }
        .link-more:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- 偽のメニューバー -->
    <nav>
        <span></span>
        <span>Store</span>
        <span>Mac</span>
        <span>iPad</span>
        <span>iPhone</span>
        <span>Support</span>
    </nav>

    <!-- メインコンテンツ -->
    <div class="hero-section">
        <div class="tagline">まったく新しい、その先へ。</div>
        <h1 class="product-title">iPhone 18 Pro</h1>
        
        <!-- Liquid Glassで浮かぶ未来のiPhone -->
        <div class="iphone-mock"></div>

        <div class="cta-area">
            <a href="#" class="link-more">さらに詳しく ＞</a>
            <a href="#" class="btn-buy" onclick="alert('予約注文開始中')">購入</a>
        </div>
    </div>

</body>
</html>
